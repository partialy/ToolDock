appId: cn.partial.tooldock
productName: ToolDock
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: true
asarUnpack:
  - "**/*.node"
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

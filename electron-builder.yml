appId: cn.partial.tooldock
productName: ToolDock
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
electronDist: node_modules/electron/dist
extraResources:
  - from: resources/media/bin
    to: media/bin
  - from: resources/media/binaries.lock.json
    to: media/binaries.lock.json
  - from: src/assets/tooldock-icon.ico
    to: tooldock-icon.ico
  - from: native/quick-launch-runner/publish
    to: quick-launch-runner
    filter:
      - 'ToolDock.QuickLaunchRunner.exe'
npmRebuild: true
asarUnpack:
  - "**/*.node"
win:
  # 必须修改 EXE 资源中的图标，不能仅依赖窗口运行时 icon。
  signAndEditExecutable: true
  icon: src/assets/tooldock-icon.ico
  target:
    - nsis
nsis:
  installerIcon: src/assets/tooldock-icon.ico
  uninstallerIcon: src/assets/tooldock-icon.ico
  installerHeaderIcon: src/assets/tooldock-icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

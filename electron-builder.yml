appId: cn.partial.tooldock
productName: ToolDock
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: native/quick-launch-runner/publish
    to: quick-launch-runner
    filter:
      - 'ToolDock.QuickLaunchRunner.exe'
npmRebuild: true
asarUnpack:
  - "**/*.node"
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<title>ToolDock 文件快传</title>
</head>
<body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="i-transfer" viewBox="0 0 24 24"><path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 17V5m-4 4 4-4 4 4M4 17v3h16v-3"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2h8l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm8 0v6h5M8 13h8M8 17h6"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5 9a8 8 0 0 1 14-2l1 5M4 12l1 5a8 8 0 0 0 14-2"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
<symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M9 16a5 5 0 0 1 6 0M12 20h.01"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M18 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM6 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm12 7a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM8.6 13.4l6.8 3.9M15.4 6.7 8.6 10.6"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></symbol>
<symbol id="i-message" viewBox="0 0 24 24"><path d="M21 11.6a8 8 0 0 1-11.6 7.1L4 20l1.3-4.4A8 8 0 1 1 21 11.6Z"/></symbol>
</svg>
<main class="app">
<section id="login" class="login-page">
 <div class="login-visual"><div class="login-visual-inner"><svg><use href="#i-transfer"/></svg></div></div>
 <h2>连接 ToolDock</h2>
 <p class="helper">与主设备在同一局域网内，输入六位访问码或者扫描二维码即可连接共享文件池。</p>
 <form id="login-form"><label class="field-label" for="pin">连接访问码</label><input id="pin" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="输入 6 位数字" required><button class="action-primary" type="submit">连接电脑 <svg><use href="#i-transfer"/></svg></button></form>
</section>
<div id="workspace" hidden>
 <div id="panel-pool" class="pane" hidden>
  <div class="usage"><div><strong>共享文件池</strong><small id="pool-usage">0 B / 20 GiB</small></div><div class="usage-track"><div id="pool-progress"></div></div></div>
  <div class="section-heading"><div><h2>所有设备共享</h2><p data-device-name>当前设备：—</p></div><button id="pool-refresh" type="button" class="icon-button" aria-label="刷新文件池"><svg><use href="#i-refresh"/></svg></button></div>
  <div class="pool-filters"><input id="pool-search" type="search" placeholder="搜索文件或上传设备..." aria-label="文件池搜索"><select id="pool-sort" aria-label="文件池排序"><option value="newest">最新上传</option><option value="oldest">最早上传</option><option value="name">名称</option><option value="size">大小</option></select></div>
  <nav id="pool-breadcrumbs" class="breadcrumbs" aria-label="文件池目录"></nav>
  <div class="selection-bar"><button id="pool-select-all" type="button" class="text-button">全选当前页</button><span id="pool-selected-count">尚未选择</span></div>
  <div id="pool-files" class="file-list"></div>
  <div class="more-holder"><button id="pool-more" type="button" class="mini-button" hidden>加载更多</button></div>
  <div class="action-area pool-actions"><button id="pool-download-selected" class="action-primary" type="button" disabled><svg><use href="#i-download"/></svg>下载所选</button><button id="pool-download-all" class="action-secondary" type="button"><svg><use href="#i-download"/></svg>打包全部</button></div>
  <button id="pool-fab" type="button" class="upload-fab" aria-label="上传文件" title="上传文件"><svg><use href="#i-upload"/></svg></button>
 </div>
 <div id="panel-download" class="pane">
  <div class="section-heading"><div><h2>分享 <span id="share-count" class="count">0</span></h2><p data-device-name>当前设备：—</p></div><button type="button" id="refresh" class="icon-button" aria-label="刷新共享文件" title="刷新"><svg><use href="#i-refresh"/></svg></button></div>
  <nav id="breadcrumbs" class="breadcrumbs" aria-label="当前目录"></nav>
  <div class="selection-bar"><button id="select-all" class="text-button" type="button">全选文件</button><span id="selection-summary">尚未选择文件</span></div>
  <div id="shares" class="file-list"></div>
  <div id="download-selection" class="selected-area" hidden><div class="selection-title">已选文件 <span id="selected-download-count"></span></div><div id="download-selected-list" class="selection-chips"></div></div>
  <div class="action-area"><a id="download-selected" class="action-primary" role="button" aria-disabled="true" tabindex="-1"><svg><use href="#i-download"/></svg><span>下载所选文件</span></a><a id="download-all" class="action-secondary" href="/api/zip"><svg><use href="#i-download"/></svg> 下载全部 ZIP</a></div>
 </div>
 <div id="panel-messages" class="pane messages-pane" hidden>
  <div class="section-heading"><div><h2>文字消息池</h2><p data-device-name>当前设备：—</p></div><button id="messages-refresh" type="button" class="icon-button" aria-label="刷新消息"><svg><use href="#i-refresh"/></svg></button></div>
  <div id="messages-list" class="messages-list"></div>
  <div class="message-composer"><textarea id="message-input" rows="3" aria-label="输入消息" placeholder="输入或粘贴文本，支持多行..."></textarea><button id="message-send" type="button" class="action-primary">发送</button></div>
 </div>
 <section id="panel-upload" class="upload-drawer" hidden>
  <div class="drawer-heading"><h3>上传到文件池</h3><button id="upload-close" class="icon-button" type="button" aria-label="关闭上传队列"><svg><use href="#i-close"/></svg></button></div>
  <p id="upload-hint" class="helper">文件传输完成后即进入所有设备共享的文件池</p>
  <div class="upload-pickers"><button type="button" id="pick-files" class="mini-button choose-button"><svg><use href="#i-plus"/></svg>选择文件</button><button type="button" id="pick-folder" class="mini-button choose-button">选择文件夹</button></div>
  <input id="choose" class="sr-file-input" type="file" multiple aria-label="选择上传文件">
  <input id="choose-folder" class="sr-file-input" type="file" multiple webkitdirectory directory aria-label="选择上传文件夹">
  <div id="upload-selection" class="selected-area" hidden><div class="section-heading compact"><div><h3>待上传文件 <span id="selected-upload-count" class="count">0</span></h3><p id="upload-total"></p></div><button type="button" id="clear-selected" class="text-button danger">清空</button></div><div id="selected-upload-list" class="file-list"></div></div>
  <div id="uploads" class="file-list upload-progress-list"></div>
  <div class="action-area"><button type="button" id="upload" class="action-primary" disabled><svg><use href="#i-upload"/></svg> 上传到文件池</button></div>
 </section>
 <section id="text-viewer" class="text-viewer" hidden>
  <div class="drawer-heading"><h3>临时文本查看器</h3><button id="viewer-close" type="button" class="icon-button" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
  <p id="viewer-info" class="helper"></p>
  <div class="pool-filters"><input id="viewer-search" type="search" placeholder="在全文中搜索..."><button id="viewer-find" type="button" class="mini-button">搜索</button></div>
  <div id="viewer-hits" class="viewer-hits"></div><pre id="viewer-content" class="viewer-content"></pre>
  <div class="viewer-controls"><button id="viewer-prev" type="button" class="mini-button">上一段</button><button id="viewer-next" type="button" class="mini-button">下一段</button><button id="viewer-copy" type="button" class="mini-button">复制全文</button><a id="viewer-download" class="mini-button" download>下载 TXT</a></div>
 </section>
 <nav class="bottom-nav" aria-label="页面导航">
  <button type="button" id="tab-download" class="nav-item active" aria-current="page"><span class="nav-icon"><svg><use href="#i-share"/></svg></span><span class="nav-label">分享</span></button>
  <button type="button" id="tab-pool" class="nav-item"><span class="nav-icon"><svg><use href="#i-folder"/></svg><span id="pool-count" class="nav-badge" aria-hidden="true" hidden>0</span></span><span class="nav-label">文件池</span></button>
  <button type="button" id="tab-messages" class="nav-item"><span class="nav-icon"><svg><use href="#i-message"/></svg><span id="messages-count" class="nav-badge" aria-hidden="true" hidden>0</span></span><span class="nav-label">消息池</span></button>
 </nav>
</div>
<div id="toasts" class="toast-viewport" aria-live="polite"></div>
</main>
<script type="module" src="/main.ts"></script>
</body>
</html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>ToolDock 文件快传</title></head><body><main class="app"><header><div class="logo">⇄</div><div><h1>ToolDock 文件快传</h1><small>局域网文件传输 · 不经过云端</small></div></header><section id="login" class="card"><h2>连接电脑</h2><p class="muted">输入 ToolDock 电脑端显示的 6 位访问码，或扫描电脑屏幕中的二维码。</p><form id="login-form"><input id="pin" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 位访问码" required/><button type="submit">连接</button></form></section><div id="workspace" hidden><section class="card"><div class="row"><h2>电脑共享文件</h2><button id="refresh" class="secondary">刷新</button></div><div id="shares" class="files"></div><a class="wide button" id="download-all" href="/api/zip">下载全部（ZIP）</a></section><section class="card"><h2>发送文件到电脑</h2><p class="muted">文件会先上传到隔离区，必须由电脑用户确认后才保存到正式目录。</p><input id="choose" type="file" multiple/><button id="upload" class="wide">发送文件</button><div id="uploads" class="files"></div></section></div><p id="error" role="alert"></p><footer>仅建议在可信家庭或办公局域网使用 · HTTP 传输不加密</footer></main><script type="module" src="/main.ts"></script></body></html>
